<style>
:root{
  --bg:#EBEEF3; --surface:#FFFFFF; --surface2:#F3F5F9;
  --ink:#151821; --ink2:#333A4A; --muted:#59606F; --line:#CDD4DF; --line2:#E3E7EE;
  --accent:#0C245B; --accent-soft:#DDE4F0; --on-accent:#FFFFFF; --brand-or:#E8612A;
  --ok:#1F6E54; --warn:#8E5F12; --bad:#96412F;
  --ok-bg:#D6EBE0; --warn-bg:#F5E6C4; --bad-bg:#F3D9D3;
  --band-work:#BEDECF; --band-edge:#EFDCAF; --band-off:#D8DDE6;
  --warn-row:#FBF3E0; --bad-row:#FAECE8; --ok-row:#EDF6F1; --on-sem:#FFFFFF;
  --sel:#0C245B; --sel-ol:rgba(12,36,91,.28); --h1a:#0C245B; --h1b:#2E5A8F; --arc:.34;
  --shadow:0 1px 2px rgba(21,24,33,.06), 0 10px 26px -14px rgba(21,24,33,.22);
  --lbw:126px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1015; --surface:#171A21; --surface2:#1F232B;
    --ink:#ECEFF4; --ink2:#CBD1DC; --muted:#9BA2B1; --line:#333945; --line2:#252A33;
    --accent:#8FA9C9; --accent-soft:#1B2740; --on-accent:#0B1220; --brand-or:#F0844F;
    --ok:#6BC9A6; --warn:#E3B45E; --bad:#E68A75;
    --ok-bg:#1B3A31; --warn-bg:#3C3218; --bad-bg:#3B2520;
    --band-work:#255045; --band-edge:#4C4022; --band-off:#242935;
    --warn-row:#2A2415; --bad-row:#2C1D1A; --ok-row:#172A25; --on-sem:#12141A;
    --sel:#8FA9C9; --sel-ol:rgba(143,169,201,.32); --h1a:#DEE8F4; --h1b:#8FA9C9; --arc:.45;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#171A21; --surface2:#1F232B;
  --ink:#ECEFF4; --ink2:#CBD1DC; --muted:#9BA2B1; --line:#333945; --line2:#252A33;
  --accent:#8FA9C9; --accent-soft:#1B2740; --on-accent:#0B1220; --brand-or:#F0844F;
  --ok:#6BC9A6; --warn:#E3B45E; --bad:#E68A75;
  --ok-bg:#1B3A31; --warn-bg:#3C3218; --bad-bg:#3B2520;
  --band-work:#255045; --band-edge:#4C4022; --band-off:#242935;
  --warn-row:#2A2415; --bad-row:#2C1D1A; --ok-row:#172A25; --on-sem:#12141A;
  --sel:#8FA9C9; --sel-ol:rgba(143,169,201,.32); --h1a:#DEE8F4; --h1b:#8FA9C9; --arc:.45;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body[data-lang="en"]{font-family:Archivo,"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;line-height:1.6}
.wrap{max-width:1060px;margin:0 auto;padding:30px 20px 80px;display:flex;flex-direction:column;gap:20px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header.hd{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hd-txt{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:Archivo,system-ui,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Archivo,system-ui,sans-serif;font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--ink2);font-size:14.5px;max-width:62ch;margin:0}
.langsw{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.langsw button{border:none;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.langsw button:hover{color:var(--accent)}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-title{font-family:Archivo,system-ui,sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.card-note{font-size:12.5px;color:var(--muted)}
.card-bd{padding:16px 18px}

input,select,button,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input[type=date],select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=date]{font-family:"IBM Plex Mono",monospace}
button{cursor:pointer;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
label.lb{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:Archivo,system-ui,sans-serif}

.cond{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.field{display:flex;flex-direction:column;gap:5px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12.5px;padding:6px 11px;border-radius:999px}

.sec-lb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 9px}
.sec-lb .t{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.sec-lb button{font-size:12.5px;padding:5px 10px}

.loc-list{display:flex;flex-direction:column;gap:7px}
.loc{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;
  padding:9px 12px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px}
.loc.base{border-color:var(--accent);background:var(--accent-soft)}
.rad{display:flex;align-items:center;justify-content:center}
.rad input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.loc-id{display:flex;flex-direction:column;gap:1px;min-width:0}
.loc-name{font-weight:500;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cc{font-family:Archivo,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 5px;border-radius:4px;background:var(--ink);color:var(--surface)}
.loc.base .cc{background:var(--accent);color:var(--on-accent)}
.loc-meta{font-size:12.5px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.dst{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn)}
.dst.std{background:transparent;color:var(--muted);border:1px solid var(--line)}
.wins{display:none;gap:14px;align-items:center;grid-column:2/4}
.show-win .wins{display:flex;flex-wrap:wrap}
.win{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.win select{padding:5px 7px;font-size:13px;font-family:"IBM Plex Mono",monospace;background:var(--surface);width:84px}
.x{background:transparent;border:1px solid transparent;color:var(--muted);padding:4px 9px;border-radius:6px;font-size:17px;line-height:1}
.x:hover{color:var(--bad);border-color:var(--line);background:var(--surface)}

.picker{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
.picker input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14.5px}
.opts{max-height:270px;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:3px}
.opt-g{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:9px 4px 3px;font-family:Archivo,sans-serif;text-transform:uppercase}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;padding:7px 9px;border-radius:7px;font-size:14px}
.opt:hover,.opt:focus-visible{background:var(--surface);border-color:var(--accent)}
.opt .o-off{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.opt .o-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-none{padding:14px 4px;color:var(--muted);font-size:13.5px}

.res{display:flex;flex-direction:column;gap:12px}
.slot{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.slot.hero{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot.on{border-color:var(--accent)}
.slot-hd{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--surface2);border-bottom:1px solid var(--line2);flex-wrap:wrap;cursor:pointer}
.slot.hero .slot-hd{background:var(--accent-soft)}
.rank{font-family:Archivo,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--muted)}
.slot.hero .rank{color:var(--accent)}
.slot-base{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.slot.hero .slot-base{font-size:22px}
.verdict{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.v-ok{background:var(--ok-bg);color:var(--ok)}
.v-near{background:var(--warn-bg);color:var(--warn)}
.v-bad{background:var(--bad-bg);color:var(--bad)}
.gap{flex:1}
.score{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;background:transparent;border:1px solid transparent;padding:3px 7px;border-radius:6px}
.score:hover{border-color:var(--line);color:var(--accent)}
#scorehelp{font-family:inherit;font-size:12.5px}
.slot-bd{padding:3px 15px 10px}
.tl{width:100%;border-collapse:collapse}
.tl td{padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}
.tl tr:last-child td{border-bottom:none}
.tl .c-name{color:var(--ink)}
.nm-sub{color:var(--muted);font-size:13px}
.tl .c-why{font-size:12.5px;color:var(--muted);padding-left:16px}
.tl .c-time{font-family:"IBM Plex Mono",monospace;font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.d-ok{background:var(--ok)}.d-near{background:var(--warn)}.d-bad{background:var(--bad)}
.why-ok{color:var(--ok)}.why-near{color:var(--warn)}.why-bad{color:var(--bad)}
.tag{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:7px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.we{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.dy{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.slot-ft{font-size:12.5px;color:var(--muted);padding:0 15px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.slot-ft b{color:var(--ink2);font-weight:700}
.acts{display:flex;gap:8px;padding:0 15px 14px;flex-wrap:wrap;align-items:center}
.acts button,.acts a{font-size:13px;padding:8px 13px;border-radius:8px;text-decoration:none;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink2);display:inline-block}
.acts a:hover,.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts a.pri,.acts button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.acts a.pri:hover,.acts button.pri:hover{filter:brightness(1.1);color:var(--on-accent);border-color:var(--accent)}
.warnbar{padding:11px 18px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warnbar.we{background:var(--bad-bg);color:var(--bad)}
.warnbar.dst{background:var(--accent-soft);color:var(--accent)}
.warnbar .wbtn{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--surface);border-color:currentColor;color:inherit}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);cursor:pointer;padding:8px 0}
.chk input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.ft-we{color:var(--bad)}
.bf-priv{font-size:12.5px;color:var(--ink2);max-width:64ch;margin:0 auto 8px;line-height:1.7}
.bf-mail{color:var(--accent);text-decoration:none}
.bf-mail:hover{text-decoration:underline}
details.more>summary,details.dstd>summary{cursor:pointer;font-size:13.5px;color:var(--accent);padding:9px 2px;list-style:none;display:flex;align-items:center;gap:7px}
details>summary::-webkit-details-marker{display:none}
details.more>summary::before,details.dstd>summary::before{content:"\25B8";font-size:11px}
details[open].more>summary::before,details[open].dstd>summary::before{content:"\25BE"}
.more-in{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.howto{font-size:13px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;margin-bottom:12px}
.howto ul{margin:7px 0 0;padding-left:19px}
.howto li{margin:3px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}

.chart-wrap{position:relative}
.chart{overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.chart-inner{min-width:640px}
.fade{position:absolute;top:0;bottom:8px;width:34px;pointer-events:none;opacity:0;transition:opacity .18s;z-index:3}
.fade.l{left:calc(var(--lbw) + 10px);background:linear-gradient(90deg,var(--surface),rgba(255,255,255,0))}
.fade.r{right:0;background:linear-gradient(270deg,var(--surface),rgba(255,255,255,0))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fade.l{background:linear-gradient(90deg,var(--surface),rgba(0,0,0,0))}
 :root:not([data-theme="light"]) .fade.r{background:linear-gradient(270deg,var(--surface),rgba(0,0,0,0))}}
:root[data-theme="dark"] .fade.l{background:linear-gradient(90deg,var(--surface),rgba(0,0,0,0))}
:root[data-theme="dark"] .fade.r{background:linear-gradient(270deg,var(--surface),rgba(0,0,0,0))}
.fade.on{opacity:1}
.crow{display:grid;grid-template-columns:var(--lbw) 1fr;gap:10px;align-items:center;margin-bottom:5px}
.crow-lb{position:sticky;left:0;z-index:2;align-self:stretch;background:var(--surface);font-size:13px;color:var(--ink2);
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px 2px 0}
.crow-lb .off{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.band{display:grid;grid-template-columns:repeat(48,1fr);height:28px;border-radius:5px;overflow:hidden;border:1px solid var(--line2);cursor:crosshair}
.cell{background:var(--band-off)}
.cell.work{background:var(--band-work)}
.cell.edge{background:var(--band-edge)}
.cell.sel{background-image:linear-gradient(var(--sel-ol),var(--sel-ol));box-shadow:inset 0 -3px 0 var(--sel)}
.axis{display:grid;grid-template-columns:repeat(48,1fr);margin-top:2px}
.axis span{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;grid-column:span 4;border-left:1px solid var(--line);padding-left:3px}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:13px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}

.dstlist{display:flex;flex-direction:column;gap:7px}
.dstlist{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 20px;align-items:baseline}
.dstrow{display:contents;font-size:13px}
.dstrow .who{white-space:nowrap}
.dstrow .who{color:var(--ink2)}
.dstrow .when{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.dsth{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:var(--bg);
  padding:10px 17px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s;z-index:30}
.toast.on{opacity:1;bottom:34px}

@media (max-width:680px){
  :root{--lbw:104px}
  .fade.l{left:calc(var(--lbw) + 8px)}
  .wrap{padding:22px 14px 70px;gap:16px}
  header.hd{gap:12px}
  .loc{grid-template-columns:auto 1fr auto;row-gap:8px}
  .loc .sp{display:none}
  .loc .x{grid-row:1;grid-column:3;align-self:start}
  .wins{grid-column:1/-1}
  .crow{gap:8px}
  .crow-lb{font-size:12px}
  .dstlist{display:flex;flex-direction:column;gap:11px}
  .dstrow{display:block}
  .dstrow .who,.dstrow .when{display:block}
  .slot.hero .slot-base{font-size:20px}
  .nm-sub{display:none}
  .acts{gap:7px}
  .acts button,.acts a{font-size:13px;padding:12px 14px;min-height:44px;display:inline-flex;align-items:center}
  .quick button{min-height:44px;padding:10px 15px;font-size:13.5px}
  .sec-lb button{min-height:44px;padding:10px 14px}
  .x{min-width:44px;min-height:44px}
  details.more>summary,details.dstd>summary{min-height:44px;padding:12px 2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- BeyondBridge&Co. brand chrome ---- */
.masthead{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(168deg,#0C245B 0%,#0C245B 46%,#0A1C42 100%)}
.topbar{background:transparent;color:#fff;width:100%;position:relative;z-index:2;
  border-bottom:1px solid rgba(255,255,255,.13)}
.hero{position:relative}
.hero-in{--heroW:1100px;max-width:1340px;margin:0 auto;padding:34px 26px 92px;position:relative;z-index:1;
  display:flex;flex-direction:column;gap:16px}
.topbar-in{max-width:none;margin:0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:11px max(20px, calc((100% - 1060px)/2 + 20px)) 11px 26px}
.wordmark{font-family:Archivo,system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;
  color:#fff;text-decoration:none;white-space:nowrap}
.wordmark:hover{color:#F3C4B0}
.wordmark .amp{color:#E8612A}
.topbar .langsw{background:transparent;border-color:rgba(255,255,255,.38);padding:2px}
.topbar .langsw button{color:rgba(255,255,255,.8);padding:5px 13px;font-size:12.5px}
.topbar .langsw button:hover{color:#fff}
.topbar .langsw button[aria-pressed="true"]{background:#fff;color:#0C245B}
h1{display:flex;align-items:baseline;gap:.26em;flex-wrap:wrap;font-size:54px;line-height:1;
  letter-spacing:-.035em;color:#fff;padding:0;margin:0}
.t-a{font-weight:700}
.t-b{font-weight:500;color:#93AFD2;letter-spacing:-.025em}
.hero .eyebrow{color:rgba(255,255,255,.62)}
.hero .sub{color:rgba(255,255,255,.78);max-width:var(--heroW);font-size:15px;line-height:1.85;
  white-space:pre-line}
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(4,auto);justify-content:start;
  gap:11px 24px;max-width:var(--heroW)}
.steps li{display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.4;
  color:rgba(255,255,255,.8)}
.stp-n{flex:none;width:23px;height:23px;border-radius:50%;
  border:1.5px solid rgba(232,97,42,.9);color:#F0A184;
  display:flex;align-items:center;justify-content:center;
  font-family:Archivo,system-ui,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0}
@media (max-width:900px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch}
}
.title-block{position:relative;padding-left:21px}
.title-block::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,#E8612A 0%,#E8612A 55%,rgba(232,97,42,0) 100%)}
.title-block .eyebrow{margin-bottom:11px}
.hd-arc{position:absolute;right:max(26px, calc((100% - 1340px)/2 + 26px));bottom:-58px;
  width:330px;height:165px;border:3px solid #E8612A;border-bottom:0;border-radius:165px 165px 0 0;
  opacity:.5;pointer-events:none;z-index:0}
.hd-arc::before,.hd-arc::after{content:"";position:absolute;bottom:-58px;width:3px;height:58px;background:#E8612A;opacity:.55}
.hd-arc::before{left:-3px}
.hd-arc::after{right:-3px}
.wrap{position:relative;z-index:2;margin-top:-58px}
@media (max-width:680px){

.card-title{display:inline-block;padding-bottom:4px;border-bottom:2px solid var(--brand-or)}

/* ---- logo ---- */
.wordmark{display:inline-flex;align-items:center;line-height:0}
.wordmark img{height:26px;width:auto;display:block}
.wordmark:hover{opacity:.85}
@media (max-width:680px){ .wordmark img{height:21px} }

/* ---- selected-time panel ---- */
.selp{margin-top:14px;border:1px solid var(--accent);border-radius:11px;background:var(--surface);overflow:hidden}
.selp:empty{display:none}
.selp-hd{display:flex;align-items:center;gap:11px;padding:10px 15px;background:var(--accent-soft);
  border-bottom:1px solid var(--line2);flex-wrap:wrap}
.selp-lb{font-family:Archivo,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;

.selp .tl{padding:0}
.selp table.tl{margin:2px 15px;width:calc(100% - 30px)}
.selp .slot-ft{padding:0 15px 10px}
.selp .acts{padding:0 15px 13px}

/* ---- setup extras ---- */
.field.grow{flex:1 1 220px;min-width:180px}
#mtitle{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.setup-acts{margin-top:14px;padding-top:13px;border-top:1px solid var(--line2)}
.setup-acts button{font-size:12.5px;padding:7px 12px;border-radius:8px}
#reset.armed{border-color:var(--bad);color:var(--bad)}
h2.card-title{margin:0;font-weight:600}
@media (max-width:680px){
  .cond{gap:13px}
  .field.wecell{width:100%}
  .field.wecell .lb.spacer{display:none}
  .field.grow{flex-basis:100%}
  .selp-time{font-size:19px}
}

/* ---- per-region severity encoding ---- */
.tl .c-name{padding-left:11px;border-left:4px solid transparent}
.tl tr.r-ok .c-name{border-left-color:var(--ok)}
.tl tr.r-near .c-name{border-left-color:var(--warn)}
.tl tr.r-bad .c-name{border-left-color:var(--bad)}
.tl tr.r-near td{background:var(--warn-row)}
.tl tr.r-bad td{background:var(--bad-row)}
.tl .c-time{padding-right:11px}
.tl .c-time .tv{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:500}
.st{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;padding:2px 9px;
  border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-near{background:var(--warn);color:var(--on-sem)}
.st-bad{background:var(--bad);color:var(--on-sem)}

/* ---- two-column layout on wide screens ---- */
.cols{display:flex;flex-direction:column;gap:20px}
.col-l,.col-r{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (min-width:1120px){
  .wrap{max-width:1340px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,510px);gap:20px;align-items:start}
  .sub{max-width:70ch}
}

/* ---- wide layout: chart+answer left, option list right ---- */
@media (min-width:1120px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(310px,370px)}

  .col-r{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;scrollbar-width:thin}
  .col-l .chart-inner{min-width:0}

}
/* ---- compact option rows ---- */

  font-family:inherit;transition:border-color .14s,background .14s}
.mini:hover{border-color:var(--accent);background:var(--surface2)}
.mini.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.mini-top{display:flex;align-items:baseline;gap:9px;width:100%}
.mini-time{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.mini.on .rank{color:var(--accent)}
.mini-dots{margin-left:auto;display:inline-flex;gap:4px;align-self:center}
.md{width:9px;height:9px;border-radius:50%;display:inline-block}
.mini .verdict{font-size:11.5px;padding:2px 9px}
.mini-out{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini.on .mini-out{color:var(--ink2)}

/* ---- answer panel now lives in its own card ---- */
#selpanel.selp{margin-top:0;border:none;border-radius:0;background:transparent;overflow:visible}

#selpanel .slot-ft{padding:10px 0 0}
#selpanel .acts{padding:13px 0 0}
#selpanel .selp-time{font-size:26px}

#warnbar:empty{display:none}

.md{width:10px;height:10px}
.lbrow{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;

.outro-h{margin:0 0 12px;font-family:Archivo,system-ui,sans-serif;font-size:26px;font-weight:700;
  letter-spacing:-.02em;line-height:1.25;color:var(--accent)}
.outro-text{margin:0 0 14px;font-size:13.5px;line-height:1.95;color:var(--ink2);max-width:100%}
.outro-text2{margin-bottom:0}
.outro-grid{display:flex;flex-direction:column;gap:16px;width:100%}
.ocard{display:flex;align-items:center;gap:17px;padding:20px 22px;border:1px solid var(--line);

  transition:border-color .16s,background .16s,transform .16s}

.ocard-ic{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--brand-or);
  color:var(--brand-or);display:inline-flex;align-items:center;justify-content:center}

.ocard-lb{font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--brand-or);line-height:1}
.ocard-v{font-size:15px;font-weight:600;color:var(--ink);line-height:1.45;overflow-wrap:anywhere}

}

  .outro-logo{width:74px;height:74px}

}

/* ================= タイムゾーン計算 ================= */
var FMT={};
function fmt(tz){ if(!FMT[tz]) FMT[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,
  year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); return FMT[tz]; }
function parts(ts,tz){ var o={},a=fmt(tz).formatToParts(new Date(ts));
  for(var i=0;i<a.length;i++)o[a[i].type]=a[i].value;
  var h=+o.hour; if(h===24)h=0;
  return {y:+o.year,m:+o.month,d:+o.day,h:h,mi:+o.minute}; }
function offMin(ts,tz){ var p=parts(ts,tz); return Math.round((Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)-ts)/60000); }
function wallToTs(y,m,d,h,mi,tz){ var target=Date.UTC(y,m-1,d,h,mi),guess=target;
  for(var i=0;i<3;i++){ var n=target-offMin(guess,tz)*60000; if(n===guess)break; guess=n; } return guess; }
var WDJA=["日","月","火","水","木","金","土"], WDEN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var WDFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function wallOf(ts,tz){ var p=parts(ts,tz); p.wd=new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay(); p.min=p.h*60+p.mi; return p; }
function pad(n){ return (n<10?"0":"")+n; }
function hm(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function tlabel(m){ return m>=1440?"24:00":hm(m); }
function offLabel(m){ var s=m<0?"-":"+",a=Math.abs(m); return "UTC"+s+pad(Math.floor(a/60))+":"+pad(a%60); }
function stdOff(ts,tz){ var y=parts(ts,tz).y;
  return Math.min(offMin(Date.UTC(y,0,15,12,0),tz), offMin(Date.UTC(y,6,15,12,0),tz)); }
function isDST(ts,tz){ return offMin(ts,tz)>stdOff(ts,tz); }
var TRANS={};
function nextTransition(ts,tz){
  var key=tz+"|"+Math.floor(ts/86400000); if(TRANS[key]!==undefined) return TRANS[key];
  var base=offMin(ts,tz), DAY=86400000, found=null;
  for(var i=1;i<=400;i++){ var t=ts+i*DAY;
    if(offMin(t,tz)!==base){ var lo=t-DAY,hi=t;
      while(hi-lo>60000){ var mid=lo+Math.floor((hi-lo)/2/60000)*60000;
        if(mid<=lo||mid>=hi)break; if(offMin(mid,tz)===base)lo=mid; else hi=mid; }
      found={ts:hi,from:base,to:offMin(hi,tz)}; break; } }
  TRANS[key]=found; return found;
}

/* ================= 言語ヘルパー ================= */
function T(k){ return STR[state.lang][k]; }
function nameOf(C){ return state.lang==="ja"?C.ja:C.en; }
function splitName(n){
  var i=n.indexOf("（"); if(i<0) i=n.indexOf(" (");
  return i<0?[n,""]:[n.slice(0,i),n.slice(i)];
}
function nameHtml(C){ var p=splitName(nameOf(C));
  return p[1]?p[0]+'<span class="nm-sub">'+p[1]+'</span>':p[0]; }
function shortName(C){ return splitName(nameOf(C))[0]; }
function fmtDur(m){
  if(state.lang==="ja"){ if(m<60) return m+"分"; var h=Math.floor(m/60),r=m%60; return h+"時間"+(r?r+"分":""); }
  if(m<60) return m+"m";
  var H=Math.floor(m/60),R=m%60; return H+"h"+(R?" "+R+"m":"");
}
function fmtDate(w,withYear){
  if(state.lang==="ja") return (withYear?w.y+"年":"")+w.m+"月"+w.d+"日（"+WDJA[w.wd]+"）";
  return WDEN[w.wd]+", "+MON[w.m-1]+" "+w.d+(withYear?", "+w.y:"");
}
function RNG(){ return state.lang==="ja"?"〜":"–"; }
function dayTag(w){ return state.lang==="ja"?(w.m+"/"+w.d):(MON[w.m-1]+" "+w.d); }

/* ================= 状態 ================= */
var DEF={open:8*60,close:18*60}, SGW={open:6*60,close:22*60};
function makeLoc(tz){ var w=(tz==="Asia/Singapore")?SGW:DEF; return {tz:tz,open:w.open,close:w.close}; }
function todayIn(tz){ var p=parts(Date.now(),tz); return p.y+"-"+pad(p.m)+"-"+pad(p.d); }
function dstr(d){ return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
function toUTCDate(str){ var p=str.split("-"); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function wdOf(str){ return toUTCDate(str).getUTCDay(); }
function nextWeekdayFrom(str){
  var d=toUTCDate(str);
  while(d.getUTCDay()===0||d.getUTCDay()===6) d.setUTCDate(d.getUTCDate()+1);
  return dstr(d);
}
var navLang=(navigator.language||"en").toLowerCase();
var DEFAULT_TZS=["Asia/Singapore","Asia/Tokyo","America/New_York"];
function deviceZone(){
  var tz=null;
  try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
  if(!tz) return null;
  if(BY_TZ[tz]) return tz;
  var now=Date.now(), off;
  try{ off=offMin(now,tz); }catch(e){ return null; }
  var pre=String(tz).split("/")[0], best=null;
  for(var k in BY_TZ){
    var o; try{ o=offMin(now,k); }catch(e){ continue; }
    if(o!==off) continue;
    if(k.split("/")[0]===pre) return k;
    if(!best) best=k;
  }
  return best;
}
function initialLocs(){
  var dz=deviceZone(), list=[];
  if(dz) list.push(dz);
  DEFAULT_TZS.forEach(function(t){ if(list.length<3 && list.indexOf(t)<0) list.push(t); });
  if(!list.length) list=DEFAULT_TZS.slice(0,3);
  return list.map(makeLoc);
}
var INIT_LOCS=initialLocs();
var state={ date:nextWeekdayFrom(todayIn(INIT_LOCS[0].tz)), dur:60,
  locs:INIT_LOCS,
  sel:null, showWin:false, recent:[], includeWeekend:false, title:"",
  lang:(navLang.indexOf("ja")===0?"ja":"en") };
try{

  if(sv){
    if(sv.locs&&sv.locs.length){ var L=sv.locs.filter(function(l){return BY_TZ[l.tz];}).slice(0,5); if(L.length) state.locs=L; }
    if(sv.dur) state.dur=sv.dur;
    if(sv.recent) state.recent=sv.recent.filter(function(t){return BY_TZ[t];}).slice(0,8);
    if(sv.lang==="ja"||sv.lang==="en") state.lang=sv.lang;
    if(typeof sv.includeWeekend==="boolean") state.includeWeekend=sv.includeWeekend;
    if(typeof sv.title==="string") state.title=sv.title.slice(0,120);
  }
}catch(e){}
function save(){ try{ localStorage.setItem("bridge-hours-v2",
  JSON.stringify({locs:state.locs,dur:state.dur,recent:state.recent,lang:state.lang,includeWeekend:state.includeWeekend,title:state.title})); }catch(e){} }

/* ================= 評価 ================= */
function judge(startMin,dur,L){
  var e=startMin+dur;
  if(startMin>=L.open && e<=L.close){
    var sc=100, lunch=(startMin<780&&e>720);
    if(startMin>=540&&e<=1020) sc+=15; else sc+=6;
    if(lunch) sc-=6;
    var why = state.lang==="ja"
      ? (lunch?"希望時間内（昼休みにかかります）":"希望時間内")
      : (lunch?"Within preferred hours (overlaps lunch)":"Within preferred hours");
    return {st:"ok",sc:sc,why:why,out:0};
  }
  var early=Math.max(0,L.open-startMin), late=Math.max(0,e-L.close), out=early+late, why;
  if(state.lang==="ja"){
    if(early&&late) why="希望枠より"+fmtDur(out)+"はみ出します";
    else if(early)  why="希望開始より"+fmtDur(early)+"早い";
    else            why="希望終了を"+fmtDur(late)+"超過";
  } else {
    if(early&&late) why=fmtDur(out)+" outside preferred hours";
    else if(early)  why=fmtDur(early)+" before preferred start";
    else            why=fmtDur(late)+" past preferred end";
  }
  var st=(startMin>=L.open-60 && e<=L.close+60)?"near":"bad";
  return {st:st,sc:st==="near"?55:0,why:why,out:out};
}
function evalSlot(ts){
  var rows=[],bad=0,near=0,total=0,out=0;
  for(var i=0;i<state.locs.length;i++){
    var L=state.locs[i], w=wallOf(ts,L.tz), r=judge(w.min,state.dur,L);
    if(r.st==="bad")bad++; else if(r.st==="near")near++;
    total+=r.sc; out+=r.out;
    rows.push({loc:L,wall:w,st:r.st,why:r.why});
  }
  var we=0;
  rows.forEach(function(r){ if(r.wall.wd===0||r.wall.wd===6) we++; });
  var raw=Math.round(total/(state.locs.length*115)*100);
  return {ts:ts,rows:rows,bad:bad,near:near,out:out,we:we,
          score:Math.max(0,raw-25*bad-15*we)};
}
function dayStartTs(){ var p=state.date.split("-"); return wallToTs(+p[0],+p[1],+p[2],0,0,state.locs[0].tz); }
function ranked(){
  var t0=dayStartTs(), raw=[];
  for(var k=0;k<96;k++) raw.push(evalSlot(t0+k*15*60000));
  var all = state.includeWeekend ? raw : raw.filter(function(s){ return s.we===0; });
  var blockedByWeekend = (all.length===0 && raw.length>0);
  all.sort(function(a,b){
    if(a.we!==b.we) return a.we-b.we;
    if(a.bad!==b.bad) return a.bad-b.bad;
    if(a.out!==b.out) return a.out-b.out;
    if(b.score!==a.score) return b.score-a.score;
    return a.ts-b.ts; });
  var minOut = all.length ? all[0].out : 0;
  var tieMin = all.filter(function(x){ return x.out===minOut; }).length;
  var keep=[];
  for(var i=0;i<all.length&&keep.length<6;i++){
    var ok=true;
    for(var j=0;j<keep.length;j++) if(Math.abs(all[i].ts-keep[j].ts)<90*60000) ok=false;
    if(ok) keep.push(all[i]);
  }
  keep.minOut=minOut; keep.tieMin=tieMin; keep.blockedByWeekend=blockedByWeekend; keep.considered=all.length;
  return keep;
}
function whoIs(s,st){
  return s.rows.filter(function(r){ return r.st===st; })
               .map(function(r){ return shortName(BY_TZ[r.loc.tz]); });
}
function verdictOf(s){
  var ja=(state.lang==="ja"), badWho=whoIs(s,"bad"), nearWho=whoIs(s,"near");
  if(s.bad===0&&s.near===0)
    return {cls:"v-ok",txt: ja?"全地域が希望枠内":"Fits everyone"};
  if(s.bad===0){
    if(s.near===1) return {cls:"v-near",txt: ja?(nearWho[0]+" が少しはみ出し"):(nearWho[0]+" slightly outside")};
    if(s.near===2) return {cls:"v-near",txt: ja?(nearWho.join("・")+" が少しはみ出し"):(nearWho.join(" and ")+" slightly outside")};
    return {cls:"v-near",txt: ja?(s.near+"地域が少しはみ出し"):(s.near+" regions slightly outside")};
  }
  if(s.bad===1) return {cls:"v-bad",txt: ja?(badWho[0]+" に大きな調整"):(badWho[0]+" needs a big stretch")};
  if(s.bad===2) return {cls:"v-bad",txt: ja?(badWho.join("・")+" に大きな調整"):(badWho.join(" and ")+" need a big stretch")};
  return {cls:"v-bad",txt: ja?(s.bad+"地域に大きな調整"):(s.bad+" regions need a big stretch")};
}

}
function renderLocs(){

      '<div class="win"><span>'+T("closeLb")+'</span>'+timeSelect(i,"close",L.close)+'</div></div>';
    box.appendChild(row);
  });
  box.querySelectorAll("select[data-k]").forEach(function(sel){
    sel.addEventListener("change",function(){

/* ================= ピッカー ================= */
function optHtml(tz){
  var C=BY_TZ[tz], off=offMin(dayStartTs()+12*3600000,tz);
  return '<button class="opt" type="button" data-tz="'+tz+'"><span class="o-n">'+nameOf(C)+'</span>'+
         '<span class="o-off">'+offLabel(off)+'</span></button>';
}
function renderOpts(){
  var q=($("q").value||"").trim().toLowerCase();
  var used={}; state.locs.forEach(function(l){ used[l.tz]=1; });
  var html="";
  function group(title,list){
    list=list.filter(function(tz){ return !used[tz]; });
    if(list.length) html+='<div class="opt-g">'+title+'</div>'+list.map(optHtml).join("");
  }
  if(!q){
    if(state.recent.length) group(T("gRecent"), state.recent.slice(0,6));
    group(T("gCommon"), COMMON);
    DB.forEach(function(g){ group(state.lang==="ja"?g[0]:g[1], g[2].map(function(c){ return c[0]; })); });
  } else {
    var hit=0;
    DB.forEach(function(g){
      var list=g[2].filter(function(c){
        return !used[c[0]] && ((c[1]+" "+c[3]+" "+c[4]+" "+c[0]).toLowerCase().indexOf(q)>=0);
      }).map(function(c){ return c[0]; });
      if(list.length){ hit+=list.length;
        html+='<div class="opt-g">'+(state.lang==="ja"?g[0]:g[1])+'</div>'+list.map(optHtml).join(""); }
    });
    if(!hit) html='<div class="pk-none">'+T("pkNone")+'</div>';
  }
  var box=$("opts"); box.innerHTML=html;
  box.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click",function(){ addLoc(b.dataset.tz); }); });
}
function closePicker(refocus){
  var p=$("picker"); if(!p || p.hidden) return;
  p.hidden=true;
  var t=$("addtoggle");
  t.setAttribute("aria-expanded","false");
  t.textContent=T("addOpen");
  $("q").value="";
  if(refocus){ try{ t.focus(); }catch(e){} }
}
function addLoc(tz){
  if(state.locs.length>=5){ toast(T("maxFive")); return; }
  if(state.locs.some(function(l){ return l.tz===tz; })) return;
  state.locs.push(makeLoc(tz));
  state.recent=[tz].concat(state.recent.filter(function(t){ return t!==tz; })).slice(0,8);
  state.sel=null; save(); closePicker(true); renderAll();
  toast(state.lang==="ja" ? (nameOf(BY_TZ[tz])+" を追加しました") : ("Added "+nameOf(BY_TZ[tz])));
}

/* ================= 候補 ================= */
function slotText(s){
  var bw=s.rows[0].wall;
  var head=state.lang==="ja"
    ? fmtDate(bw,true)+"／所要 "+state.dur+"分"
    : fmtDate(bw,true)+" / "+state.dur+" min";
  var lines=[head,""];
  s.rows.forEach(function(r){
    var C=BY_TZ[r.loc.tz], w=r.wall, e=w.min+state.dur;
    var note=(e>=1440||w.d!==bw.d||w.m!==bw.m)?(" ("+dayTag(w)+")"):"";
    lines.push(nameOf(C)+" "+hm(w.min)+RNG()+hm(e)+note);
  });
  return lines.join("\n");
}
var CAN_DL = (function(){ try{ return window.self===window.top; }catch(e){ return false; } })();
function meetingTitle(){ return (state.title||"").trim() || "Cross-border meeting"; }
function icsEsc(t){ return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;")
  .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function icsStamp(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
  pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z"; }
function downloadICS(s){
  var st=new Date(s.ts), en=new Date(s.ts+state.dur*60000);
  var uid="bh-"+s.ts+"-"+Math.random().toString(36).slice(2,8)+"@beyondbridge.co";
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BeyondBridge&Co.//Bridge Hours//EN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+uid,
    "DTSTAMP:"+icsStamp(new Date()),"DTSTART:"+icsStamp(st),"DTEND:"+icsStamp(en),
    "SUMMARY:"+icsEsc(meetingTitle()),
    "DESCRIPTION:"+icsEsc(slotText(s)),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  try{
    var blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="meeting.ics"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },500);
  }catch(e){ toast(T("copyFail")); }
}
function shareUrl(){
  var p=["d="+state.date,"m="+state.dur,"w="+(state.includeWeekend?1:0),"g="+state.lang,
    "t="+encodeURIComponent((state.title||"").slice(0,120)),
    "l="+state.locs.map(function(L){ return encodeURIComponent(L.tz)+"~"+L.open+"-"+L.close; }).join(",")];
  return location.origin+location.pathname+"#"+p.join("&");
}
function readShare(){
  var h=(location.hash||"").replace(/^#/,""); if(!h) return false;
  var q={}; h.split("&").forEach(function(kv){ var i=kv.indexOf("="); if(i>0) q[kv.slice(0,i)]=kv.slice(i+1); });
  var ok=false;
  if(q.d&&/^\d{4}-\d{2}-\d{2}$/.test(q.d)){ state.date=q.d; ok=true; }
  if(q.m&&+q.m>0){ state.dur=+q.m; ok=true; }
  if(q.w==="1"||q.w==="0"){ state.includeWeekend=(q.w==="1"); ok=true; }
  if(q.g==="ja"||q.g==="en"){ state.lang=q.g; ok=true; }
  if(q.t!==undefined){ try{ state.title=decodeURIComponent(q.t).slice(0,120); ok=true; }catch(e){} }
  if(q.l){
    var L=q.l.split(",").map(function(t){
      var m=t.split("~"), tz=decodeURIComponent(m[0]), w=(m[1]||"").split("-");
      if(!BY_TZ[tz]) return null;
      var o=+w[0], c=+w[1];
      if(!isFinite(o)||!isFinite(c)||c<=o) { var d=makeLoc(tz); o=d.open; c=d.close; }
      return {tz:tz,open:o,close:c};
    }).filter(Boolean).slice(0,5);
    if(L.length){ state.locs=L; ok=true; }
  }
  return ok;
}
function outlookUrl(s){
  var st=new Date(s.ts), en=new Date(s.ts+state.dur*60000);
  function iso(d){ return d.toISOString().replace(/\.\d{3}Z$/,"Z"); }
  return "https://outlook.office.com/calendar/0/deeplink/compose"+
    "?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&allday=false"+
    "&subject="+encodeURIComponent(meetingTitle())+
    "&body="+encodeURIComponent(slotText(s))+
    "&startdt="+iso(st)+"&enddt="+iso(en);
}
function gcalUrl(s){
  var st=new Date(s.ts), en=new Date(s.ts+state.dur*60000);
  function z(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
    pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z"; }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(meetingTitle())+
    "&details="+encodeURIComponent(slotText(s))+
    "&dates="+z(st)+"/"+z(en);
}
var CONSIDERED=96;
function slotRows(s){
  var bw=s.rows[0].wall;
  return s.rows.map(function(r){
    var C=BY_TZ[r.loc.tz], w=r.wall, e=w.min+state.dur, tags="";
    if(w.wd===0||w.wd===6) tags+='<span class="tag we">'+T("weekend")+'</span>';
    if(w.d!==bw.d) tags+='<span class="tag dy">'+dayTag(w)+'</span>';
    else if(e>=1440) tags+='<span class="tag dy">'+T("nextDay")+'</span>';
    var lab=r.st==="ok"?T("stOk"):(r.st==="near"?T("stNear"):T("stBad"));
    return '<tr class="r-'+r.st+'"><td class="c-name">'+nameHtml(C)+tags+
           '<div class="c-why why-'+r.st+'">'+r.why+'</div></td>'+
           '<td class="c-time"><div class="tv">'+hm(w.min)+" "+RNG()+" "+hm(e)+'</div>'+
           '<span class="st st-'+r.st+'">'+lab+'</span></td></tr>';
  }).join("");
}
function slotFoot(s,minOut,isBest){
  var totalTxt=s.out?fmtDur(s.out):(state.lang==="ja"?"0分":"0m");
  var foot='<b>'+(state.lang==="ja"?("枠外の合計 "+totalTxt):("Total outside: "+totalTxt))+'</b>';
  if(s.we) foot+='<span class="ft-we">'+T("weNote")+'</span>';
  if(isBest)
    foot+='<span>'+(state.lang==="ja"
      ? (TIEMIN>1?"この日の候補の中で同率最小です":"この日の候補の中で最小です")
      : (TIEMIN>1?"Tied for the lowest of all options on this date":"The lowest of all options on this date"))+'</span>';
  else if(minOut!==undefined){
    var diff=fmtDur(Math.max(0,s.out-minOut));
    foot+='<span>'+(state.lang==="ja"?("最有力候補との差 "+diff):(diff+" more than the best option"))+'</span>';
  }
  return foot;
}
function actionsHtml(s,pri){
  return '<a href="'+gcalUrl(s)+'" target="_blank" rel="noopener"'+(pri?' class="pri"':'')+'>'+T("gcal")+'</a>'+
    '<a href="'+outlookUrl(s)+'" target="_blank" rel="noopener"'+(pri?' class="pri"':'')+'>'+T("outlook")+'</a>'+
    (CAN_DL?'<button type="button" data-ics="1"'+(pri?' class="pri"':'')+'>'+T("ics")+'</button>':'')+
    '<button type="button" data-copy="1">'+T("copy")+'</button>';
}
function wireActions(el,s){
  el.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click",function(){
      var t=slotText(s);
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).then(function(){ toast(T("copied")); },function(){ toast(T("copyFail")); });
      else toast(T("copyFail")); });
  });
  el.querySelectorAll("[data-ics]").forEach(function(b){
    b.addEventListener("click",function(){ downloadICS(s); }); });
}
function slotMini(s,rank,minOut){
  var bw=s.rows[0].wall, v=verdictOf(s);
  var el=document.createElement("button");
  el.type="button"; el.className="mini"; el.dataset.ts=String(s.ts);
  var dots=s.rows.map(function(r){
    var lab=r.st==="ok"?T("stOk"):(r.st==="near"?T("stNear"):T("stBad"));
    return '<i class="md d-'+r.st+'" title="'+nameOf(BY_TZ[r.loc.tz])+": "+lab+'"></i>';
  }).join("");
  var out=T("outLb")+" "+(s.out?fmtDur(s.out):(state.lang==="ja"?"0分":"0m"));
  if(minOut!==undefined && s.out===minOut) out+=(state.lang==="ja"?" ・ ":" · ")+(TIEMIN>1?T("lowestTie"):T("lowest"));
  el.innerHTML=
    '<span class="mini-top"><span class="rank">#'+rank+'</span>'+
      '<span class="mini-time">'+hm(bw.min)+'</span>'+
      '<span class="mini-dots">'+dots+'</span></span>'+
    '<span class="verdict '+v.cls+'">'+v.txt+'</span>'+
    '<span class="mini-out">'+out+'</span>';
  el.addEventListener("click",function(){ selectTime(s.ts,true); });
  return el;
}
function markSelected(){
  var cur=focusTs();
  document.querySelectorAll("#res .mini").forEach(function(el){
    el.classList.toggle("on", Number(el.dataset.ts)===cur);
    el.setAttribute("aria-pressed", String(Number(el.dataset.ts)===cur));
  });
}
var MINOUT=0, BESTTS=null, TIEMIN=1;
function renderRes(){
  var box=$("res"); box.innerHTML="";
  var list=ranked(), minOut=list.minOut;
  CONSIDERED=list.considered||96;
  var bars=[];
  var wd=wdOf(state.date);
  if(wd===0||wd===6)
    bars.push('<div class="warnbar we">'+T("weWarnA")+(state.lang==="ja"?(WDJA[wd]+"曜日"):WDFULL[wd])+T("weWarnB")+
      ' <button class="wbtn" type="button" data-nwd="1">'+T("nextWd")+'</button></div>');
  var dstHits=[], t0=dayStartTs(), tEnd=t0+8*86400000;
  state.locs.forEach(function(L){
    var t=nextTransition(t0-86400000,L.tz);
    if(t && t.ts<tEnd){
      var w=wallOf(t.ts,L.tz), diff=(t.to-t.from)/60;
      dstHits.push(nameOf(BY_TZ[L.tz])+"（"+pad(w.m)+"/"+pad(w.d)+" "+(diff>0?"+":"")+diff+"h）");
    }
  });
  if(dstHits.length) bars.push('<div class="warnbar dst">'+T("dstWarnA")+dstHits.join(" / ")+T("dstWarnB")+'</div>');
  if(list.length&&list[0].bad) bars.push('<div class="warnbar">'+T("warn")+'</div>');
  $("warnbar").innerHTML=bars.join("");
  $("warnbar").querySelectorAll("[data-nwd]").forEach(function(b){
    b.addEventListener("click",function(){
      state.date=nextWeekdayFrom(state.date); $("date").value=state.date; state.sel=null; renderAll(); });
  });
  if(list.blockedByWeekend){
    box.innerHTML='<div class="empty">'+T("weNone")+'</div>';
    var wrap=document.createElement("div"); wrap.className="quick"; wrap.style.justifyContent="center";
    var b1=document.createElement("button"); b1.type="button"; b1.className="btn-primary"; b1.textContent=T("nextWd");
    b1.addEventListener("click",function(){ state.date=nextWeekdayFrom(state.date); $("date").value=state.date; state.sel=null; renderAll(); });
    var b2=document.createElement("button"); b2.type="button"; b2.textContent=T("incWeekend");
    b2.addEventListener("click",function(){ state.includeWeekend=true; $("incwe").checked=true; save(); renderAll(); });
    wrap.appendChild(b1); wrap.appendChild(b2); box.appendChild(wrap);
    return;
  }
  if(!list.length){ box.innerHTML='<div class="empty">'+T("empty")+'</div>'; return; }
  MINOUT=minOut; TIEMIN=list.tieMin||1; BESTTS=list[0].ts;
  for(var i=0;i<Math.min(3,list.length);i++) box.appendChild(slotMini(list[i],i+1,minOut));
  if(list.length>3){
    var n=list.length-3, d=document.createElement("details"); d.className="more";
    d.innerHTML='<summary>'+(state.lang==="ja"?("他の候補を見る（"+n+"件）"):(n+" more options"))+
      '</summary><div class="more-in"></div>';
    var inn=d.querySelector(".more-in");
    for(var j=3;j<list.length;j++) inn.appendChild(slotMini(list[j],j+1,minOut));
    box.appendChild(d);
  }
  markSelected();
}
var HOWTO={
 ja:'<div class="howto"><b>適合度の計算方法</b><ul>'+
  '<li>各地域は最大115点です。会議が希望枠に完全に収まると100点、さらに9:00〜17:00に収まると15点、それ以外の枠内は6点を加算します。12:00〜13:00にかかる場合は6点引きます。</li>'+
  '<li>希望枠からのはみ出しが60分以内なら55点、60分を超えると0点です。</li>'+
  '<li>合計を満点で割って100点換算し、大きな調整が必要な地域1件につき25点、現地が週末になる地域1件につき15点を引きます。</li>'+
  '<li>候補は、①週末を含む地域が少ない、②大きな調整が必要な地域が少ない、③枠外時間の合計が短い、④適合度が高い、⑤時刻が早い、の順で並びます。</li>'+
  '<li>「枠外の合計」は、各地域の希望枠からはみ出した分数を全地域で足したものです。この数字が小さいほど、誰かに無理を頼む量が少なくなります。</li>'+
  '</ul></div>',
 en:'<div class="howto"><b>How the score works</b><ul>'+
  '<li>Each region scores up to 115. A meeting fully inside the preferred hours earns 100, plus 15 more if it also sits inside 09:00 to 17:00, or 6 otherwise. Overlapping 12:00 to 13:00 costs 6.</li>'+
  '<li>Spilling outside the preferred hours by 60 minutes or less scores 55. More than 60 minutes scores 0.</li>'+
  '<li>The total is normalised to 100, then 25 points come off for every region that needs a big stretch and 15 for every region where the meeting lands on a weekend.</li>'+
  '<li>Options are ranked in this order: fewest regions on a weekend, then fewest regions needing a big stretch, then the shortest total time outside preferred hours, then the highest score, then the earliest time.</li>'+
  '<li>"Total outside" adds up the minutes each region falls outside its preferred hours. The smaller it is, the less you are asking of anyone.</li>'+
  '</ul></div>'
};
function toggleHelp(force){
  var h=$("howto"), b=$("scorehelp");
  var open=(force!==undefined)?force:h.hidden;
  h.hidden=!open; b.setAttribute("aria-expanded",String(open));
  h.innerHTML=open?HOWTO[state.lang]:"";
  if(open) h.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ================= 24時間ビュー ================= */
function catOf(min,L){
  var e=min+30;
  if(min>=L.open&&e<=L.close) return "work";
  if(min>=L.open-60&&e<=L.close+60) return "edge";
  return "";
}
function focusTs(){ if(state.sel!==null) return state.sel; var r=ranked(); return r.length?r[0].ts:null; }
var KFOCUS=null, REFOCUS=false;
function selectTime(ts,bringIntoView){
  state.sel=ts; renderChart(); renderSel();
  if(bringIntoView){
    var pc=$("selpanel").closest("section")||$("selpanel"), cr=pc.getBoundingClientRect();
    var vis=(cr.top>=0 && cr.bottom<=window.innerHeight);
    if(!vis) pc.scrollIntoView({behavior:"smooth",block:"start"});
    setTimeout(function(){ scrollChartTo(ts); }, vis?0:340);
  } else {
    var p=$("selpanel"), r=p.getBoundingClientRect();
    if(r.bottom>window.innerHeight-8||r.top<0) p.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
}
function renderSel(){
  var box=$("selpanel"); if(!box) return;
  var ts=focusTs();
  if(ts===null||!state.locs.length){ box.innerHTML=""; return; }
  var s=evalSlot(ts), bw=s.rows[0].wall, v=verdictOf(s);
  var isBest=(s.out===MINOUT);
  var t=$("t-sel"); if(t) t.textContent=(ts===BESTTS)?T("bestTitle"):T("selTitle");
  box.innerHTML=
    '<div class="selp-hd">'+
      '<span class="selp-time">'+hm(bw.min)+'</span>'+
      '<span class="card-note">'+BY_TZ[state.locs[0].tz].cc+' '+T("baseSuffix")+'</span>'+
      '<span class="verdict '+v.cls+'">'+v.txt+'</span>'+
      '<span class="gap"></span>'+
      '<span class="score">'+T("scoreLb")+s.score+'</span>'+
    '</div>'+
    '<table class="tl"><tbody>'+slotRows(s)+'</tbody></table>'+
    '<div class="slot-ft">'+slotFoot(s,MINOUT,isBest)+'</div>'+
    '<div class="acts">'+actionsHtml(s,true)+'</div>';
  wireActions(box,s);
  markSelected();
}
function renderChart(){
  var t0=dayStartTs(), box=$("chart"); box.innerHTML="";
  var ln=$("listnote"); if(ln) ln.textContent=BY_TZ[state.locs[0].tz].cc+" "+T("baseSuffix");
  var baseTz=state.locs[0].tz, bw=wallOf(t0,baseTz), bn=nameOf(BY_TZ[baseTz]);
  $("axisnote").textContent = state.lang==="ja"
    ? (bn+" の "+fmtDate(bw)+" 0時から24時")
    : ("Midnight to midnight on "+fmtDate(bw)+" in "+bn);
  var f=focusTs(), fEnd=(f!==null)?f+state.dur*60000:null;
  state.locs.forEach(function(L,i){
    var C=BY_TZ[L.tz];
    var off=offMin(t0+12*3600000,L.tz)-offMin(t0+12*3600000,baseTz);
    var row=document.createElement("div"); row.className="crow";
    var lb=document.createElement("div"); lb.className="crow-lb";
    var sn=shortName(C), pfx=(sn.indexOf(C.cc+" ")===0)?"":(C.cc+" ");
    lb.innerHTML=pfx+sn+'<br><span class="off">'+
      (i===0?T("base"):(off>=0?"+":"")+(off/60)+"h")+'</span>';
    var band=document.createElement("div"); band.className="band";
    band.setAttribute("role","group"); band.setAttribute("aria-label",nameOf(C));
    var isBase=(i===0), selK=(f!==null)?Math.round((f-t0)/(30*60000)):0;
    if(isBase&&KFOCUS===null) KFOCUS=Math.max(0,Math.min(47,selK));
    for(var k=0;k<48;k++){
      var ts=t0+k*30*60000, w=wallOf(ts,L.tz), c=document.createElement("div");
      var cat=catOf(w.min,L);
      c.className="cell"+(cat?" "+cat:"");
      if(f!==null && ts+30*60000>f && ts<fEnd) c.classList.add("sel");
      c.title=nameOf(C)+" "+hm(w.min); c.dataset.k=k;
      if(isBase){
        c.setAttribute("role","button");
        c.setAttribute("aria-label", hm(w.min)+" "+nameOf(C));
        c.setAttribute("aria-pressed", String(k===selK));
        c.tabIndex=(k===KFOCUS)?0:-1;
      }
      band.appendChild(c);
    }
    band.addEventListener("click",function(ev){
      var t=ev.target.closest(".cell"); if(!t) return;
      KFOCUS=+t.dataset.k; selectTime(t0+KFOCUS*30*60000,false); });
    if(isBase) band.addEventListener("keydown",function(ev){
      var k=(KFOCUS===null)?0:KFOCUS, nk=k;
      if(ev.key==="ArrowRight"||ev.key==="ArrowDown") nk=Math.min(47,k+1);
      else if(ev.key==="ArrowLeft"||ev.key==="ArrowUp") nk=Math.max(0,k-1);
      else if(ev.key==="Home") nk=0;
      else if(ev.key==="End") nk=47;
      else if(ev.key==="Enter"||ev.key===" "||ev.key==="Spacebar") nk=k;
      else return;
      ev.preventDefault(); KFOCUS=nk; REFOCUS=true;
      selectTime(t0+nk*30*60000,false);
    });
    row.appendChild(lb); row.appendChild(band); box.appendChild(row);
  });
  var ax=document.createElement("div"); ax.className="crow";
  var axl=document.createElement("div"); axl.className="crow-lb";
  var axb=document.createElement("div"); axb.className="axis";
  for(var q=0;q<12;q++){ var s=document.createElement("span"); s.textContent=pad(q*2); axb.appendChild(s); }
  ax.appendChild(axl); ax.appendChild(axb); box.appendChild(ax);
  if(REFOCUS){ var fc=box.querySelector('.band .cell[data-k="'+KFOCUS+'"]'); if(fc) fc.focus({preventScroll:true}); REFOCUS=false; }
  updateFades();
}
function scrollChartTo(ts){
  var sc=$("chartScroll"), band=document.querySelector(".band");
  if(!sc||!band||ts===null||ts===undefined) return;
  var t0=dayStartTs(), idx=(ts-t0)/(30*60000);
  var cr=sc.getBoundingClientRect(), br=band.getBoundingClientRect();
  var x=(br.left-cr.left+sc.scrollLeft)+br.width*(idx/48);
  var target=Math.max(0,Math.min(sc.scrollWidth-sc.clientWidth, x-sc.clientWidth/2));
  try{ sc.scrollTo({left:target,behavior:"smooth"}); }catch(e){ sc.scrollLeft=target; }
  updateFades();
}
function updateFades(){
  var sc=$("chartScroll"); if(!sc) return;
  var max=sc.scrollWidth-sc.clientWidth;
  var j=$("jump"); if(j) j.style.display=(max>4?"":"none");
  $("fadeL").classList.toggle("on", sc.scrollLeft>4);
  $("fadeR").classList.toggle("on", max>4 && sc.scrollLeft<max-4);
}

/* ================= 夏時間 ================= */
function renderDST(){
  var ref=dayStartTs()+12*3600000, now=$("dstnow"), nxt=$("dstnext");
  now.innerHTML=""; nxt.innerHTML="";
  state.locs.forEach(function(L){
    var C=BY_TZ[L.tz], off=offMin(ref,L.tz), dst=isDST(ref,L.tz), std=stdOff(ref,L.tz);
    var a=document.createElement("div"); a.className="dstrow";
    var stat = dst
      ? (state.lang==="ja" ? ("夏時間 適用中（標準時 "+offLabel(std)+"）") : ("DST in effect (standard "+offLabel(std)+")"))
      : (state.lang==="ja" ? "標準時" : "Standard time");
    var sep=state.lang==="ja"?"　":" · ";
    a.innerHTML='<span class="who">'+nameOf(C)+'</span><span class="when">'+offLabel(off)+sep+stat+'</span>';
    now.appendChild(a);
    var t=nextTransition(ref,L.tz), b=document.createElement("div"); b.className="dstrow";
    if(!t) b.innerHTML='<span class="who">'+nameOf(C)+'</span><span class="when">'+T("noTrans")+'</span>';
    else{
      var w=wallOf(t.ts,L.tz), diff=(t.to-t.from)/60;
      var dtxt = state.lang==="ja" ? ((diff>0?"+":"")+diff+"時間")
                                   : ((diff>0?"+":"")+diff+(Math.abs(diff)===1?" hour":" hours"));
      var jp=state.lang==="ja";
      b.innerHTML='<span class="who">'+nameOf(C)+'</span><span class="when">'+
        w.y+"/"+pad(w.m)+"/"+pad(w.d)+" "+hm(w.min)+(jp?"　":" · ")+dtxt+
        (jp?"（":" (")+offLabel(t.from)+" → "+offLabel(t.to)+(jp?"）":")")+"</span>";
    }
    nxt.appendChild(b);
  });
}

function renderAll(){ renderLocs(); renderRes(); renderChart(); renderSel(); renderDST(); }

/* ================= イベント ================= */
function shiftDate(days){
  var p=state.date.split("-"), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  d.setUTCDate(d.getUTCDate()+days);
  state.date=d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
  $("date").value=state.date; state.sel=null; renderAll();
}
$("date").value=state.date;
$("date").addEventListener("change",function(){ if(!this.value)return;
  state.date=this.value; state.sel=null; renderAll(); });
$("dur").addEventListener("change",function(){ state.dur=+this.value; state.sel=null; save(); renderAll(); });
$("today").addEventListener("click",function(){
  state.date=todayIn(state.locs[0].tz); $("date").value=state.date; state.sel=null; renderAll(); });
document.querySelectorAll("[data-shift]").forEach(function(b){
  b.addEventListener("click",function(){ shiftDate(+b.dataset.shift); }); });
$("wintoggle").addEventListener("click",function(){
  state.showWin=!state.showWin; this.setAttribute("aria-pressed",String(state.showWin));
  this.textContent=state.showWin?T("winHide"):T("winShow"); renderLocs(); });
$("addtoggle").addEventListener("click",function(){
  var p=$("picker"), open=p.hidden;
  p.hidden=!open; this.setAttribute("aria-expanded",String(open));
  this.textContent=open?T("addClose"):T("addOpen");
  if(open){ renderOpts(); $("q").focus(); } });
$("q").addEventListener("input",renderOpts);
$("q").addEventListener("keydown",function(ev){
  if(ev.key==="Enter"){ var f=$("opts").querySelector(".opt"); if(f){ ev.preventDefault(); f.click(); } } });
$("scorehelp").addEventListener("click",function(){ toggleHelp(); });
$("tolist").addEventListener("click",function(){
  var sec=$("res").closest("section")||$("res");
  sec.scrollIntoView({behavior:"smooth",block:"start"}); });
$("nextwd").addEventListener("click",function(){
  var d=toUTCDate(state.date); d.setUTCDate(d.getUTCDate()+1);
  state.date=nextWeekdayFrom(dstr(d)); $("date").value=state.date; state.sel=null; renderAll(); });
$("incwe").addEventListener("change",function(){
  state.includeWeekend=this.checked; state.sel=null; save(); renderAll(); });
$("mtitle").addEventListener("input",function(){ state.title=this.value.slice(0,120); save(); renderRes(); renderSel(); });
var resetArmed=null;
$("reset").addEventListener("click",function(){
  var b=this;
  if(!resetArmed){ b.textContent=T("resetAsk"); b.classList.add("armed");
    resetArmed=setTimeout(function(){ resetArmed=null; b.textContent=T("reset"); b.classList.remove("armed"); },4000);
    return; }
  clearTimeout(resetArmed); resetArmed=null;
  try{ localStorage.removeItem("bridge-hours-v2"); }catch(e){}
  if(location.hash) location.hash="";
  location.reload();
});
$("share").addEventListener("click",function(){
  var u=shareUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(u).then(function(){ toast(T("linkCopied")); },function(){ toast(T("copyFail")); });
  else toast(T("copyFail")); });
$("jump").addEventListener("click",function(){ scrollChartTo(focusTs()); });
$("chartScroll").addEventListener("scroll",updateFades,{passive:true});
window.addEventListener("resize",updateFades);
document.querySelectorAll(".langsw button").forEach(function(b){
  b.addEventListener("click",function(){
    if(state.lang===b.dataset.lang) return;
    state.lang=b.dataset.lang; save(); applyLang(); renderAll();
    if(!$("picker").hidden) renderOpts(); });
});

window.addEventListener("hashchange",function(){
  if(readShare()){ state.sel=null; $("date").value=state.date; $("dur").value=String(state.dur);
    applyLang(); renderAll(); }
});
readShare();
$("date").value=state.date;
$("dur").value=String(state.dur);
applyLang();
renderAll();
setTimeout(function(){ scrollChartTo(focusTs()); },80);
setInterval(function(){
  var a=document.activeElement;
  if(a&&a.closest&&a.closest("#locs")) return;
  renderLocs();
},30000);
</script>
